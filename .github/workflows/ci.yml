name: CI / CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ──────────────────────────────────────────────
  # TypeScript Monorepo: Lint, Typecheck, & Tests
  # ──────────────────────────────────────────────
  ts-check:
    name: TypeScript Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skinsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @skinsense/api prisma:generate

      - name: Run database migrations
        run: pnpm --filter @skinsense/api prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skinsense_test

      - name: Build shared packages
        run: pnpm turbo run build --filter=@skinsense/types --filter=@skinsense/config

      - name: Workspace Typecheck
        run: pnpm -r typecheck

      - name: NestJS API Unit & Service Tests
        run: pnpm --filter @skinsense/api test -- --testPathIgnorePatterns="api.integration.spec"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skinsense_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ──────────────────────────────────────────────
  # Python AI Inference Service: Pytest Suite
  # ──────────────────────────────────────────────
  python-inference-check:
    name: Python AI Inference Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/inference/requirements.txt

      - name: Install Python dependencies
        working-directory: apps/inference
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        working-directory: apps/inference
        run: python -m pytest tests -v --tb=short

  # ──────────────────────────────────────────────
  # Docker Containerization Build Validation
  # ──────────────────────────────────────────────
  docker-build-check:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [ts-check, python-inference-check]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Inference Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/inference
          file: ./apps/inference/Dockerfile
          push: false
          tags: skinsense-inference:ci-test

      - name: Build API Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: skinsense-api:ci-test

      - name: Build Portal Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/portal/Dockerfile
          push: false
          tags: skinsense-portal:ci-test
